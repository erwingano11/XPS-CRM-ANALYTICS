version: "3.8"

services:
  # MySQL for conversation storage
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: crm_analytics
    volumes:
      - mysql_data:/var/lib/mysql

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    depends_on:
      - mysql
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PASSWORD=rootpassword
      - MYSQL_DATABASE=crm_analytics

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data:
